version: "3.9"
services:
  api:
    build: ./api
    ports: ["8000:8000"]
    environment:
      - DATABASE_URL=postgresql://abos:abos@db:5432/abos
    depends_on: [db, redis]
  web:
    build: ./web
    ports: ["3000:3000"]
    depends_on: [api]
  worker:
    build: ./orchestrator
    depends_on: [api, db, redis]
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: abos
      POSTGRES_PASSWORD: abos
      POSTGRES_DB: abos
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
volumes:
  pgdata:
